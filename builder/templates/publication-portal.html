<!doctype html>
<!-- Internal EvoSupplement publication portal template. Copied into Builder-generated paper projects. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EvoSupplement portal — interactive structures, genomic neighborhoods, phylogenies, networks, figures, tables, and data for this publication.">
  <meta name="theme-color" content="#111827">
  <title>Supplementary Material</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #64748b;
      --line: #dce3ec;
      --line-strong: #cbd5e1;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --header: #111820;
      --primary: #2563eb;
      --shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
      --radius: 16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #f8fafc 0, #f8fafc 60%, #f1f5f9 100%);
    }
    a:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.28);
      outline-offset: 2px;
    }

    .app-header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 10px clamp(18px, 3vw, 44px);
      background: var(--header);
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 11px;
      background: rgba(255,255,255,0.08);
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    .brand-copy { display: grid; gap: 1px; min-width: 0; }
    .brand-copy strong { font-size: 15px; line-height: 1.2; }
    .brand-copy small { color: #aeb9c7; font-size: 12px; }
    .header-links { display: flex; align-items: center; gap: 18px; }
    .header-links a { color: #dbe4ef; text-decoration: none; font-size: 13px; font-weight: 650; }
    .header-links a:hover { color: #fff; }
    .privacy-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      color: #cdd7e4;
      font-size: 12px;
    }
    .privacy-badge svg { width: 15px; fill: currentColor; }

    .portal-shell {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 56px;
    }
    .portal-eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .portal-title {
      margin: 0 0 10px;
      font-size: clamp(24px, 3.4vw, 34px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .portal-citation {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .portal-doi {
      display: inline-block;
      margin-bottom: 30px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .portal-doi:hover { text-decoration: underline; }
    .portal-cover { width: 100%; margin: 26px 0 30px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .portal-cover img { display: block; width: 100%; height: auto; object-fit: contain; }
    .portal-cover figcaption { margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    .portal-section { margin-top: 34px; }
    .portal-section:first-of-type { margin-top: 8px; }
    .portal-section-title {
      margin: 0 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .portal-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }
    .portal-card, .portal-card-disabled {
      display: block;
      padding: 18px 20px 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 7px 28px rgba(15,23,42,0.05);
      text-decoration: none;
      color: inherit;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }
    .portal-card:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
    }
    .portal-card-disabled {
      border-style: dashed;
      background: var(--surface-soft);
      opacity: 0.72;
      cursor: not-allowed;
    }
    .portal-badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge-viewer   { background: #dbeafe; color: #1d4ed8; }
    .badge-pdf      { background: #fee2e2; color: #b91c1c; }
    .badge-image    { background: #fce7f3; color: #be185d; }
    .badge-table    { background: #ede9fe; color: #6d28d9; }
    .badge-dataset  { background: #dcfce7; color: #15803d; }
    .badge-doc      { background: #e0e7ff; color: #4338ca; }
    .badge-external { background: #f1f5f9; color: #475569; }
    .badge-default  { background: #f1f5f9; color: #64748b; }
    .badge-pending  { background: #fef3c7; color: #92400e; }
    .portal-card h2, .portal-card-disabled h2 {
      margin: 0 0 5px;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }
    .portal-card p, .portal-card-disabled p {
      margin: 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.55;
    }
    .portal-card-arrow {
      display: inline-flex;
      margin-top: 12px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 750;
    }
    .builder-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid #cbd6e6;
      border-radius: 9px;
      color: #334155;
      background: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 750;
    }
    .builder-link:hover { border-color: #8ea2c2; background: #f8fafc; }
    .portal-description {
      max-width: 760px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .portal-error {
      margin-top: 40px;
      padding: 16px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .app-header { align-items: flex-start; }
      .privacy-badge { display: none; }
      .header-links { padding-top: 10px; }
      .portal-shell { width: min(100% - 22px, 920px); padding-top: 32px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="Home">
      <span class="brand-mark" aria-hidden="true">ES</span>
      <span class="brand-copy">
        <strong>EvoSupplement</strong>
        <small>Structures · genomic context · phylogeny · networks</small>
      </span>
    </a>
    <nav class="header-links" aria-label="Project links">
      <span class="privacy-badge" title="Interactive modules run in the browser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5.5V11c0 5.05 3.41 9.76 8 11 4.59-1.24 8-5.95 8-11V5.5L12 2Zm0 2.18 6 2.62V11c0 3.98-2.55 7.82-6 8.93C8.55 18.82 6 14.98 6 11V6.8l6-2.62Zm-1 4.32v2H9v2h2v2h2v-2h2v-2h-2v-2h-2Z"/></svg>
        Static &amp; browser-based
      </span>
    </nav>
  </header>

  <main class="portal-shell">
    <div id="portalHeader"></div>
    <div id="portalSections"></div>
    <div id="portalError" class="portal-error" hidden></div>
  </main>

  <script src="./manifest.js"></script>
  <script>
    (() => {
      'use strict';

      const BADGES = {
        viewer:   { label: 'Viewer',   class: 'badge-viewer' },
        pdf:      { label: 'PDF',      class: 'badge-pdf' },
        image:    { label: 'Image',    class: 'badge-image' },
        table:    { label: 'Table',    class: 'badge-table' },
        dataset:  { label: 'Dataset',  class: 'badge-dataset' },
        doc:      { label: 'Document', class: 'badge-doc' },
        external: { label: 'External', class: 'badge-external' }
      };

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[char]));
      }

      function badgeFor(type) {
        return BADGES[type] || { label: type ? escapeHtml(type) : 'Item', class: 'badge-default' };
      }

      function renderCard(item) {
        const hasLink = Boolean(item.href && item.href !== '#');
        const badge = badgeFor(item.type);
        const title = escapeHtml(item.title || 'Untitled');
        const description = item.description
          ? `<p>${escapeHtml(item.description)}</p>`
          : '';

        if (!hasLink) {
          return `
            <div class="portal-card-disabled">
              <span class="portal-badge badge-pending">Coming soon</span>
              <h2>${title}</h2>
              ${description}
            </div>`;
        }

        const isExternal = item.external === true || /^https?:\/\//i.test(item.href);
        const attrs = isExternal ? ' target="_blank" rel="noreferrer"' : '';
        const arrowText = isExternal ? 'Open ↗' : 'Open →';

        return `
          <a class="portal-card" href="${escapeHtml(item.href)}"${attrs}>
            <span class="portal-badge ${badge.class}">${badge.label}</span>
            <h2>${title}</h2>
            ${description}
            <span class="portal-card-arrow">${arrowText}</span>
          </a>`;
      }

      function renderCover(cover) {
        if (!cover || typeof cover.src !== 'string' || !cover.src.trim()) return '';
        const alt = typeof cover.alt === 'string' ? cover.alt : '';
        const caption = typeof cover.caption === 'string' && cover.caption.trim()
          ? `<figcaption>${escapeHtml(cover.caption)}</figcaption>`
          : '';
        return `<figure class="portal-cover"><img src="${escapeHtml(cover.src)}" alt="${escapeHtml(alt)}" decoding="async">${caption}</figure>`;
      }

      function renderHeader(paper) {
        const container = document.getElementById('portalHeader');
        if (!paper) { container.innerHTML = ''; return; }

        const citationParts = [paper.authors, paper.journal, paper.year].filter(Boolean);
        const citationHtml = citationParts.length
          ? `<p class="portal-citation">${escapeHtml(citationParts.join(' · '))}</p>`
          : '';
        const doiHtml = paper.doi
          ? `<a class="portal-doi" href="https://doi.org/${encodeURIComponent(paper.doi)}" target="_blank" rel="noreferrer">doi.org/${escapeHtml(paper.doi)} ↗</a>`
          : '';
        const descriptionHtml = paper.description
          ? `<p class="portal-description">${escapeHtml(paper.description)}</p>`
          : '';

        container.innerHTML = `
          <p class="portal-eyebrow">Supplementary material</p>
          <h1 class="portal-title">${escapeHtml(paper.title || 'Supplementary Material')}</h1>
          ${citationHtml}
          ${doiHtml}
          ${descriptionHtml}
          ${renderCover(paper.cover)}`;
      }

      function renderSections(sections) {
        const container = document.getElementById('portalSections');
        container.innerHTML = '';
        if (!Array.isArray(sections)) return;

        for (const section of sections) {
          if (!section || !Array.isArray(section.items) || !section.items.length) continue;
          const sectionEl = document.createElement('section');
          sectionEl.className = 'portal-section';
          sectionEl.innerHTML = `
            <h2 class="portal-section-title">${escapeHtml(section.title || 'Section')}</h2>
            <div class="portal-grid">${section.items.map(renderCard).join('')}</div>`;
          container.appendChild(sectionEl);
        }
      }

      try {
        const manifest = window.SUPPLEMENTARY_MANIFEST;
        if (!manifest) throw new Error('manifest.js did not define window.SUPPLEMENTARY_MANIFEST.');
        renderHeader(manifest.paper);
        renderSections(manifest.sections);
      } catch (error) {
        console.error(error);
        const errorEl = document.getElementById('portalError');
        errorEl.hidden = false;
        errorEl.textContent = `Could not load the supplementary material list: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
